<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>キャラクター診断 | 質問選択</title>

	<!-- normalize.css -->
	<link rel="stylesheet"
		  th:href="@{/css/normalize.css}"
		  href="../../../resources/static/css/normalize.css">

	<!-- 共通CSS -->
	<link rel="stylesheet"
		  th:href="@{/css/diagnosis/style.css}"
		  href="../../../resources/static/css/diagnosis/style.css">

	<!-- キャラクター一覧ページ専用CSS -->
	<link rel="stylesheet"
		  th:href="@{/css/test/testquestions.css}"
		  href="../../../resources/static/css/test/testquestions.css">
</head>

<body class="page-characters">
	
	<!-- ============================================
	     右上のミニキャラクター
	     ============================================ -->
	<div class="character-top-right">

	    <img
	        th:src="@{/images/diagnosis/test/kirinuki2.png}"
	        src="../../../resources/static/images/diagnosis/ミニキャラ右上.png"
	        alt="キャラクター">

	</div>
	
	<!-- ============================================
	     左下のミニキャラクター
	     ============================================ -->
	<div class="character-decoration">
	    <img
	        th:src="@{/images/diagnosis/test/kirinuki1.png}"
	        src="../../../resources/static/images/diagnosis/test/kirinuki1.png"
	        alt="キャラクター">
	</div>

	<div class="screen">

		<header>
			<!-- 左側：ロゴ -->
			<img
				class="title-logo"
				th:src="@{/images/diagnosis/title.png}"
				src="../../static/images/diagnosis/title.png"
				alt="鬼滅の刃診断">

			<!-- 中央：タイトル -->
			<h1 class="title">質問選択</h1>
		</header>

		<!-- ============================================
			 質問エリア
			 ============================================ -->

		<main class="main-column">
			
			<form th:action="@{/diagnosis/submit}" th:object="${diagnosisForm}" method="post">
				
				<!-- 質問1 -->
				<div class="question" th:each="entry : ${map}">
					
					<h2 class="question-title">
						<span th:text="${entry.key.body}">質問 1</span>
					</h2>
					
					<div class="choices" th:each="choice, iterStat : ${entry.value}">
	
						<label class="choice">
							
							<input type="radio"
									th:fieald="*{selects[__${entry.key.id}__]}"
									th:value="${choice.id}"
									th:requried="${iterStat.first}" />
									
							<span th:text="${choice.body}">[選択肢]</span>
						</label>
					</div>
				</div>
				
				<!-- 診断ボタン -->
				<div class="button-area">
					<button type="submit"
							class="diagnosis-button">
						診断する
					</button>
				</div>
			</form>
			
		</main>
		
		<footer class="footer">

			<a
				class="top-link"
				th:href="@{/}"
				href="index.html">

				TOP

			</a>

		</footer>

	</div>

</body>

</html>
