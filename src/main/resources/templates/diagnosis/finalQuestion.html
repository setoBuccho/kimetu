<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>キャラクター診断 | 最後の質問</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

	    <link rel="stylesheet"
	          th:href="@{/css/normalize.css}"
	          href="../../../resources/static/css/normalize.css">
	    <link rel="stylesheet"
	          th:href="@{/css/diagnosis/style.css}"
	          href="../../../resources/static/css/diagnosis/style.css">

	    <link rel="stylesheet"
	          th:href="@{/css/test/testquestions.css}"
	          href="../../../resources/static/css/test/testquestions.css">
</head>
<body class="page-characters">

    <div class="screen">

        <header>
            <img
                class="title-logo"
                th:src="@{/images/diagnosis/title.png}"
                src="../../static/images/diagnosis/title.png"
                alt="鬼滅の刃診断">

            <h1 class="title">質問選択</h1>
        </header>

        <main class="main-column">
			
			<form th:action="@{/test/diagnosis/final}" method="post">
				<div class="question">
					<h2 class="question-title"
		                th:text="${question.body}">
		                最後の質問！あなたが一番大切にしたい気持ちは？
		            </h2>
					
	                <input type="hidden"
	                       name="userId"
	                       th:value="${userId}">
	
	                <div th:each="choice : ${choices}">
	                    <label class="choice">
	                        <input type="radio"
	                               name="choiceId"
	                               th:value="${choice.id}"
	                               required>
								   
	                        <span th:text="${choice.body}">
	                            誰かの痛みに寄り添って、あきらめずに前へ進む気持ち
	                        </span>
	                    </label>
	                </div>
				</div>
				
				<button class="submit-button" type="submit">結果を見る</button>
			</form>

        </main>

        <footer class="footer">
            <a
                class="top-link"
                th:href="@{/}"
                href="index.html">
                TOP
            </a>
        </footer>

    </div>

</body>
</html>
