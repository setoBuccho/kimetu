<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>

	<!-- 文字コード -->
	<meta charset="UTF-8">

	<!-- スマホ表示用 -->
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>キャラクター診断 | キャラクター一覧</title>

	<!-- ===== Google Fonts ===== -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Shippori+Mincho:wght@400;600&display=swap"
		rel="stylesheet">

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/normalize.css}" href="../../../static/css/normalize.css">

	<link rel="stylesheet"
		th:href="@{/css/diagnosis/style.css}"
		href="../../static/css/diagnosis/style.css">

	<!-- キャラクター一覧専用CSS -->
	<link rel="stylesheet"
		th:href="@{/css/test/testcharacters.css}"
		href="../../static/css/test/testcharacters.css">
</head>


<body class="page-characters">

	<div class="screen">

		<!-- アタマ -->
		<header>
			<!-- ロゴ -->
			<a th:href="@{/}" href="index.html">
				<img
					class="title-logo"
					th:src="@{/images/diagnosis/title.png}"
					src="../../static/images/diagnosis/title.png"
					alt="鬼滅の刃診断">
			</a>

			<!-- ページタイトル -->
			<h1 class="title">キャラクター一覧</h1>


			<!-- ハンバーガー -->
			<div class="menu-wrapper">
				<button class="menu-button"
					type="button"
					onclick="toggleMenu()"
					aria-label="メニューを開く"
					aria-expanded="false"
					aria-controls="menu">
					☰
				</button>
				
				<!-- リンク一覧 -->
				<nav id="menu" class="menu-list">
					<a th:href="@{/}" href="index.html">TOP</a>
					<a th:href="@{/questions}" href="#">診断</a>
					<a th:href="@{/characters}" href="#">キャラクター一覧</a>
					<a th:href="@{/users}" href="#">ユーザー一覧</a>
				</nav>
			</div>
		</header>


		<!-- キャラクター一覧 -->
		<main class="main-column">

			<div class="card"
			     th:each="character : ${characterList}">

				<!-- キャラクター画像 -->
				<div class="thumb">
					<img th:src="@{${character.characterImagePath}}"
					     th:alt="${character.familyName}+' '+${character.firstName}"
						 src="../../static/images/diagnosis/characters/rengoku.png"
					     alt="キャラ画像">
				</div>

				<!-- キャラクター情報 -->
				<div class="info">
					<p class="kana"
					   th:text="${character.familyNameKana}+' '+${character.firstNameKana}">
						かまど たんじろう
					</p>

					<p class="name"
					   th:text="${character.familyName}+' '+${character.firstName}">
						キャラクター名
					</p>

					<div class="desc">
						<span th:text="${character.description}">
							キャラ説明文
						</span>
					</div>
				</div>
			</div>
		</main>


		<!-- ============================================
		     フッター
		     ============================================ -->
		<footer class="footer">

			<a th:href="@{/}" href="index.html">

				<img src="../../static/images/logo.png"
				     th:src="@{/images/logo.png}"
				     alt="TOPへ">

			</a>

			<p class="copyright">
				<small>&copy;Copyright 2026 304_メタモン</small>
			</p>

		</footer>

	</div>


	<!-- ============================================
	     メニューを開閉するJavaScript
	     ============================================ -->
	<script>
		function toggleMenu() {
			const menu = document.getElementById("menu");
			menu.classList.toggle("open");
		}
	</script>

</body>
</html>
