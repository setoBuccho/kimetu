<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー編集</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/user/user.css}">
</head>

<body>

    <div class="register-screen">

		<header>
		    <img src="/images/diagnosis/title.png" alt="鬼滅の刃 キャラクター診断" class="site-title-image">
		</header>
		
        <main>
			<div class="register-title edit-title">
			    <h1>ユーザー編集</h1>
			    <img src="/images/diagnosis/test/4chara.PNG" alt="鬼滅の刃のキャラクター">
			</div>

			
			<form th:action="@{/users/{id}/edit(id=${user.id})}" method="post">

            <div>
                <label for="name">名前</label>
                <input type="text"
                       id="name"
                       name="name"
                       th:value="${user.name}">
            </div>

			<div>
			    <p>診断結果</p>
			    <p th:text="${diagnosisResult}">未診断</p>
			</div>

            <div>
                <label for="body">プロフィール・自由記入欄</label>
                <textarea id="body"
                          name="body"
                          rows="10"
						  th:text="${user.body}"
                          placeholder="自己紹介や、感想など、自由に書いてください♪"></textarea>
            </div>

			<div class="edit-buttons">
			    <button type="submit" class="edit-save-button">
			        <img src="/images/diagnosis/test/save.png" alt="保存する">
			    </button>

			    <a href="/" class="edit-top-button">
			        <img src="/images/diagnosis/test/top.png" alt="TOPに戻る">
			    </a>
			</div>
			
			</form>

        </main>

    </div>

</body>
</html>
