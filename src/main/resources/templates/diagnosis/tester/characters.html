<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>キャラクター診断 | キャラクター一覧</title>
	
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<link rel="stylesheet" th:href="@{/css/normalize.css}" href="../../../static/css/normalize.css">
	<link rel="stylesheet" th:href="@{/css/diagnosis/style.css}" href="../../../static/css/diagnosis/style.css">
	
</head>
<body>
	
	<div class="screen">
		<header>
			<a href="index.html" th:href="@{/test}">
				<img class="title-logo" src="../../../static/images/diagnosis/title.png" th:src="@{/images/diagnosis/title.png}">
			</a>
			<h1 class="title">キャラクター一覧</h1>
		</header>
		
		<main class="main-column">
			<div class="card" th:each="character : ${characterList}">
				<div class="thumb">
					<img th:src="@{'/'+${character.characterImagePath}}" src="../../../static/images/diagnosis/mainTitle.png" alt="キャラ画像">
				</div>
				<div class="info">
					<p class="name" th:text="${character.familyName}+' '+${character.firstName}">キャラクター名</p>
					<div class="desc">
						<span th:text="${character.description}">キャラ説明文</span>
					</div>
				</div>
			</div>
			
		</main>
		
		<footer class="footer">
			<a th:href="@{/test}" href="index.html">
				<img src="../../../static/images/logo.png" th:src="@{/images/logo.png}"　atl="TOPへ">
			</a>
			<p class="copyright"><small>&copy;Copyright 2026 304_メタモン</small></p>
		</footer>
	</div>
</body>
</html>
