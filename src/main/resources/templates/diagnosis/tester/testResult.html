<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<!-- スマホ表示用 -->
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>診断結果</title>


	<!-- ==============================
	     Google Fonts
	     ============================== -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Shippori+Mincho:wght@400;600&display=swap"
		rel="stylesheet">


	<!-- ==============================
	     共通CSS
	     ============================== -->

	<link rel="stylesheet"
		  th:href="@{/css/normalize.css}"
		  href="../../../static/css/normalize.css">

	<link rel="stylesheet"
		  th:href="@{/css/diagnosis/style.css}"
		  href="../../../static/css/diagnosis/style.css">


	<!-- ==============================
	     診断結果ページ専用CSS
	     ============================== -->

	<link rel="stylesheet"
		  th:href="@{/css/test/testResult.css}"
		  href="../../../static/css/test/testResult.css">

</head>


<!-- page-result を付けることで
     診断結果ページ専用CSSを適用 -->

<body class="page-result">


	<div class="screen nav">


		<!-- ==================================================
		     ヘッダー
		     ================================================== -->

		<header class="nav-com">


			<!-- 左上：ロゴ -->
			<a href="index.html" th:href="@{/}">
				<img class="title-logo"
					 src="../../../static/images/diagnosis/title.png"
					 th:src="@{/images/diagnosis/title.png}"
					 alt="TOPへ">
			</a>


			<!-- 中央：ページタイトル -->
			<h1 class="title">診断結果</h1>


			<!-- ==================================================
			     右上：メニューボタン
			     ================================================== -->

			<div class="menu-wrapper">


				<!-- ☰ ボタン -->
				<button type="button"
						class="menu-button"
						onclick="toggleMenu()"
						aria-label="メニューを開く">

					☰

				</button>


				<!-- ==================================================
				     メニュー
				     ================================================== -->

				<nav id="menu" class="menu-list">


					<!-- TOP -->
					<a th:href="@{/}" href="index.html">
						TOP
					</a>


					<!-- 診断 -->
					<a th:href="@{/questions}" href="#">
						診断
					</a>


					<!-- 診断結果 -->
					<a th:href="@{/result}" href="#">
						診断結果
					</a>


					<!-- キャラクター一覧 -->
					<a th:href="@{/characters}" href="#">
						キャラクター一覧
					</a>


					<!-- ユーザー一覧 -->
					<a th:href="@{/users}" href="#">
						ユーザー一覧
					</a>


				</nav>

			</div>

		</header>



		<!-- ==================================================
		     メイン：診断結果
		     ================================================== -->

		<main class="result-main">


			<!-- 左：キャラクター画像
			     右：診断結果 -->


				 <!-- 変更後:画像のファイル名(tanjiroなど)を data-chara に入れる -->
				 <div class="result-layout"
				      th:attr="data-chara=${#strings.substringBefore(#strings.substringAfterLast(character.characterImagePath,'/'),'.')}">
				<!-- ==========================================
				     左：キャラクター画像
				     ========================================== -->

				<div class="result-image">

					<img th:src="@{${character.characterImagePath}}"
						 src="../../../static/images/diagnosis/result/tanjiro.png"
						 alt="キャラ画像">

				</div>



				<!-- ==========================================
				     右：診断結果
				     ========================================== -->

				<section class="result-box">


					<!-- 診断結果の説明 -->
					<p class="lead">
						あなたにいちばん近いキャラは…
					</p>


					<!-- キャラクター名 -->
					<p class="result-name"
					   th:text="${character.familyName}+' '+${character.firstName}">

						竈門 炭治郎

					</p>



					<!-- ======================================
					     相性
					     matchRate がある場合だけ表示
					     ====================================== -->

					<div class="match"
						 th:if="${matchRate != null}">

						<p class="match-text">

							相性

							<strong th:text="${matchRate}">
								92
							</strong>

							%

						</p>


						<div class="bar">

							<span
								th:style="'width:' + ${matchRate} + '%'"
								style="width:92%">
							</span>

						</div>

					</div>



					<!-- ======================================
					     キャラクター説明
					     ====================================== -->

					<p class="result-desc"
					   th:text="${character.description}">

						誰かの痛みに寄り添える、優しく誠実なあなた。責任感が強く、どんなに困難でも努力を重ねて前に進みます。人の気持ちを大切にしながら、最後まで諦めない頼れるリーダータイプです。

					</p>



					<!-- ======================================
					     ボタン
					     ====================================== -->

					<div class="btn-row">

						<!-- もう一度診断 -->
						<a class="btn btn-main"
						   th:href="@{/questions}"
						   href="#">

							もう一度診断する

						</a>


						<!-- キャラクター一覧 -->
						<a class="btn btn-sub"
						   th:href="@{/characters}"
						   href="#">

							キャラ一覧へ

						</a>

					</div>


				</section>

			</div>

		</main>



		<!-- ==================================================
		     フッター
		     ================================================== -->

		<footer class="footer">


			<!-- ロゴをクリックするとTOPへ -->
			<a th:href="@{/}" href="index.html">

	<img src="../../../static/images/logo.png" th:src="@{/images/logo.png}" alt="TOPへ">

			</a>


			<!-- コピーライト -->
			<p class="copyright">

				<small>
					&copy;Copyright 2026 304_メタモン
				</small>

			</p>


		</footer>


	</div>



	<!-- ==================================================
	     メニュー開閉用JavaScript
	     ================================================== -->

	<script>

		function toggleMenu() {

			const menu = document.getElementById("menu");

			menu.classList.toggle("open");

		}

	</script>


</body>
</html>
