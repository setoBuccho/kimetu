<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>キャラクター診断 | 最後の質問</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/normalize.css}">
    <link rel="stylesheet" th:href="@{/css/diagnosis/style.css}">
</head>

<body>

<div class="screen">

    <header>
        <a th:href="@{/test}">
            <img class="title-logo"
                 th:src="@{/images/diagnosis/title.png}"
                 alt="TOPへ">
        </a>

        <h1 class="title">最後の質問</h1>
    </header>

    <!-- 切り抜き画像 -->
    <div style="display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 20px auto; width: 100%; box-sizing: border-box;">
        <img th:src="@{/images/diagnosis/test/kirinuki1.png}"
             alt="切り抜き画像1"
             style="display: block; width: 45%; height: auto;">

        <img th:src="@{/images/diagnosis/test/kirinuki2.png}"
             alt="切り抜き画像2"
             style="display: block; width: 45%; height: auto;">
    </div>

    <main>

        <!-- 最後の質問 -->
        <div class="question">

            <h2 class="question-title"
                th:text="${question.body}">
                最後の質問！あなたが一番大切にしたい気持ちは？
            </h2>

            <form th:action="@{/test/diagnosis/final}" method="post">

                <input type="hidden"
                       name="userId"
                       th:value="${userId}">

                <div th:each="choice : ${choices}">

                    <label class="choice">

                        <input type="radio"
                               name="choiceId"
                               th:value="${choice.id}"
                               required>

                        <span th:text="${choice.body}">
                            誰かの痛みに寄り添って、あきらめずに前へ進む気持ち
                        </span>

                    </label>

                </div>

                <button type="submit">結果を見る</button>

            </form>

        </div>

    </main>

    <footer class="footer">

        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}"
                 alt="TOPへ">
        </a>

        <p class="copyright">
            <small>&copy;Copyright 2026 304_メタモン</small>
        </p>

    </footer>

</div>

</body>
</html>
